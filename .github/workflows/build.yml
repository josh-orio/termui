name: Build CI
on:
  push:
    paths:
      - '**.hpp'
      - '**.cpp'
      - '**/CMakeLists.txt'
      - 'Config.cmake.in'
      - '.github/workflows/build.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        compiler:
          - { cc: gcc, cxx: g++ }
          - { cc: clang, cxx: clang++ }

    steps:
      - uses: actions/checkout@v4
      - name: Build library
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j
